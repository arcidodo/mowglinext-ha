[pytest]
# Makes `from custom_components.mowglinext...` importable from tests/ without
# a repo-root conftest.py or an installed package -- pytest inserts this
# directory onto sys.path before collection (pytest>=7's "pythonpath" ini
# option). Without it, pytest (run from the repo root, as the CI workflow
# does) can't resolve custom_components as a package at all.
pythonpath = .

# pytest-asyncio defaults to STRICT mode, which requires every async test to
# be explicitly marked @pytest.mark.asyncio. auto mode (matching Home
# Assistant core's own test suite convention) runs any `async def test_*`
# under asyncio automatically, matching tests/test_config_flow.py and
# tests/test_lawn_mower.py as written.
asyncio_mode = auto
